<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Berkah Properti</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f7fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:100%;
    max-width:420px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    max-height:70px;
}

.btn-login{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-weight:600;
}

.btn-login:hover{
    background:#0b5ed7;
}

#errorMsg{
    display:none;
}
</style>
</head>
<body>

<div class="login-card">

    <div class="logo">
        <img src="img/logo.png" alt="Logo"
             onerror="this.style.display='none'">
    </div>

    <h3 class="text-center mb-2">Login Akun</h3>

    <p class="text-center text-muted mb-4">
        Silakan masuk ke akun Anda
    </p>

    <div class="alert alert-danger" id="errorMsg"></div>

    <form id="loginForm">

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="email@gmail.com"
                required>
        </div>

        <div class="mb-4">
            <label>Password</label>
            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Masukkan password"
                required>
        </div>

        <button
            type="submit"
            id="btnLogin"
            class="btn-login">
            Login
        </button>

    </form>

    <div class="text-center mt-3">
        Belum punya akun?
        <a href="register.html">Daftar</a>
    </div>

    <div class="text-center mt-2">
        <a href="index.html">← Kembali ke Beranda</a>
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvRW192UEKVKh4fMK-BvFsveSxs7g52B4",
  authDomain: "berkah-bersamapropertindo.firebaseapp.com",
  projectId: "berkah-bersamapropertindo",
  storageBucket: "berkah-bersamapropertindo.firebasestorage.app",
  messagingSenderId: "340415383230",
  appId: "1:340415383230:web:80b4424a7a221ecdf180ef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
    if(user){
        window.location.href = "index.html";
    }
});

const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const btn =
      document.getElementById("btnLogin");

    const errorMsg =
      document.getElementById("errorMsg");

    btn.disabled = true;
    btn.innerText = "Memproses...";

    errorMsg.style.display = "none";

    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        window.location.href = "index.html";

    } catch(error){

        let pesan = "Login gagal";

        if(error.code === "auth/user-not-found"){
            pesan = "Email tidak ditemukan";
        }

        if(error.code === "auth/wrong-password"){
            pesan = "Password salah";
        }

        if(error.code === "auth/invalid-email"){
            pesan = "Format email tidak valid";
        }

        errorMsg.innerText = pesan;
        errorMsg.style.display = "block";

        btn.disabled = false;
        btn.innerText = "Login";
    }

});

</script>

</body>
</html>
