<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login - Berkah Properti</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://jsdelivr.net" rel="stylesheet">
  <style>
    body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 420px; }
    .login-logo { text-align: center; margin-bottom: 24px; }
    .login-logo img { height: 50px; }
    .login-title { font-weight: 700; font-size: 1.5rem; color: #0d6efd; text-align: center; margin-bottom: 4px; }
    .login-subtitle { color: #6c757d; text-align: center; font-size: 0.9rem; margin-bottom: 28px; }
    .form-label { font-weight: 500; color: #333; }
    .form-control { border-radius: 8px; padding: 10px 14px; }
    .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15); }
    .btn-login { background: #0d6efd; color: white; padding: 12px; border-radius: 8px; font-weight: 600; border: none; width: 100%; font-size: 1rem; transition: all 0.3s; }
    .btn-login:hover { background: #0b5ed7; }
    .divider { text-align: center; color: #6c757d; margin: 16px 0; font-size: 0.85rem; }
    .alert-error { display: none; background: #f8d7da; border: 1px solid #f5c2c7; border-radius: 8px; padding: 12px 16px; color: #842029; font-size: 0.9rem; margin-bottom: 16px; }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <img src="img/logo.png" alt="Logo Berkah Properti" onerror="this.style.display='none'">
  </div>
  <h2 class="login-title">Selamat Datang</h2>
  <p class="login-subtitle">Login untuk melanjutkan ke Berkah Properti</p>
  
  <div class="alert-error" id="errorMsg"></div>
  
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" id="email" class="form-control" placeholder="email@contoh.com">
  </div>
  <div class="mb-4">
    <label class="form-label">Password</label>
    <input type="password" id="password" class="form-control" placeholder="Masukkan password">
  </div>
  
  <button class="btn-login" id="btnLogin">Masuk</button>
  
  <div class="divider">Belum punya akun?</div>
  <a href="register.html" class="btn btn-outline-primary w-100" style="border-radius: 8px; padding: 10px; font-weight: 500;">Daftar Sekarang</a>
  
  <div class="mt-3 text-center">
    <a href="index.html" class="text-muted" style="font-size: 0.85rem;">← Kembali ke Beranda</a>
  </div>
</div>

<!-- JAVASCRIPT FIREBASE AUTHENTICATION -->
<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getAuth, signInWithEmailAndPassword } from "https://gstatic.com";

  const firebaseConfig = {
    apiKey: "AIzaSyDvRW192UEKVKh4fMK-BvFsveSxs7g52B4",
    authDomain: "://firebaseapp.com",
    projectId: "berkah-bersamapropertindo",
    storageBucket: "berkah-bersamapropertindo.firebasestorage.app",
    messagingSenderId: "340415383230",
    appId: "1:340415383230:web:80b4424a7a221ecdf180ef"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const errorMsg = document.getElementById('errorMsg');
  const btnLogin = document.getElementById('btnLogin');

  // Fungsi memproses login ke Firebase
  async function handleLogin() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    errorMsg.style.display = 'none';

    if (!email || !password) {
      errorMsg.textContent = 'Email dan password wajib diisi!';
      errorMsg.style.display = 'block';
      return;
    }

    btnLogin.textContent = 'Memproses...';
    btnLogin.disabled = true;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      // Jika berhasil login, lempar kembali ke halaman Beranda utama
      window.location.href = 'index.html';
    } catch (error) {
      let msg = 'Login gagal. Silakan coba lagi.';
      
      // Deteksi error Firebase v10 terbaru secara komprehensif
      if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
        msg = 'Email atau password salah.';
      } else if (error.code === 'auth/invalid-email') {
        msg = 'Format email tidak valid.';
      } else if (error.code === 'auth/too-many-requests') {
        msg = 'Terlalu banyak percobaan gagal. Coba lagi nanti.';
      }
      
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      btnLogin.textContent = 'Masuk';
      btnLogin.disabled = false;
    }
  }

  // Jalankan fungsi saat tombol klik ditekan
  btnLogin.addEventListener('click', handleLogin);

  // Jalankan fungsi saat tombol keyboard 'Enter' ditekan
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleLogin();
    }
  });
</script>
</body>
</html>
