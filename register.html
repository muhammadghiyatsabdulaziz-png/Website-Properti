<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Akun - Berkah Properti</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f5f7fa;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-card{
    width:100%;
    max-width:450px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    max-height:70px;
}

.btn-register{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#198754;
    color:white;
    font-weight:600;
}

.btn-register:hover{
    background:#157347;
}

#errorMsg,
#successMsg{
    display:none;
}
</style>
</head>
<body>

<div class="register-card">

    <div class="logo">
        <img src="img/logo.png"
             alt="Logo"
             onerror="this.style.display='none'">
    </div>

    <h3 class="text-center mb-2">Daftar Akun</h3>

    <p class="text-center text-muted mb-4">
        Buat akun untuk menggunakan layanan Berkah Properti
    </p>

    <div class="alert alert-danger" id="errorMsg"></div>

    <div class="alert alert-success" id="successMsg">
        Pendaftaran berhasil, mengarahkan ke halaman login...
    </div>

    <form id="registerForm">

        <div class="mb-3">
            <label>Nama Lengkap</label>
            <input
                type="text"
                id="nama"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                id="email"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                id="password"
                class="form-control"
                minlength="6"
                required>
        </div>

        <div class="mb-4">
            <label>Konfirmasi Password</label>
            <input
                type="password"
                id="confirmPassword"
                class="form-control"
                minlength="6"
                required>
        </div>

        <button
            type="submit"
            id="btnRegister"
            class="btn-register">
            Daftar Sekarang
        </button>

    </form>

    <div class="text-center mt-3">
        Sudah punya akun?
        <a href="login.html">Login</a>
    </div>

    <div class="text-center mt-2">
        <a href="index.html">← Kembali ke Beranda</a>
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDvRW192UEKVKh4fMK-BvFsveSxs7g52B4",
  authDomain: "berkah-bersamapropertindo.firebaseapp.com",
  projectId: "berkah-bersamapropertindo",
  storageBucket: "berkah-bersamapropertindo.firebasestorage.app",
  messagingSenderId: "340415383230",
  appId: "1:340415383230:web:80b4424a7a221ecdf180ef"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form =
  document.getElementById("registerForm");

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const nama =
      document.getElementById("nama").value;

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const errorMsg =
      document.getElementById("errorMsg");

    const successMsg =
      document.getElementById("successMsg");

    const btn =
      document.getElementById("btnRegister");

    errorMsg.style.display = "none";

    if(password !== confirmPassword){

        errorMsg.innerText =
          "Konfirmasi password tidak cocok.";

        errorMsg.style.display =
          "block";

        return;
    }

    btn.disabled = true;
    btn.innerText = "Memproses...";

    try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        await updateProfile(
          userCredential.user,
          {
            displayName: nama
          }
        );

        successMsg.style.display =
          "block";

        setTimeout(() => {
          window.location.href =
            "login.html";
        }, 2000);

    } catch(error){

        let pesan =
          "Pendaftaran gagal.";

        if(error.code === "auth/email-already-in-use"){
          pesan =
            "Email sudah terdaftar.";
        }

        if(error.code === "auth/weak-password"){
          pesan =
            "Password minimal 6 karakter.";
        }

        if(error.code === "auth/invalid-email"){
          pesan =
            "Format email tidak valid.";
        }

        errorMsg.innerText = pesan;
        errorMsg.style.display = "block";

        btn.disabled = false;
        btn.innerText = "Daftar Sekarang";
    }

});

</script>

</body>
</html>
